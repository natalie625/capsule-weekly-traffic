<!DOCTYPE html>

<style>
  :root {
    --bg: #ffffff; --text: #1a1a1a; --text-muted: #666666; --text-faint: #999999;
    --border: #e5e5e5; --card-bg: #fafafa; --pill-bg: #eef2ff; --pill-text: #3730a3;
    --code-bg: #f1f1f1; --delta-up: #0a8a3f; --delta-down: #c0392b; --delta-flat: #888888;
    --chart-line: #4f46e5; --chart-demo: #c2410c; --grid-line: #ececec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131316; --text: #e9e9ec; --text-muted: #9a9aa2; --text-faint: #75757c;
      --border: #2a2a30; --card-bg: #1b1b1f; --pill-bg: #262a4d; --pill-text: #b7c0ff;
      --code-bg: #24242a; --delta-up: #3ecf7e; --delta-down: #ff6b6b; --delta-flat: #9a9aa2;
      --chart-line: #8b87f7; --chart-demo: #ff9757; --grid-line: #28282e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131316; --text: #e9e9ec; --text-muted: #9a9aa2; --text-faint: #75757c;
    --border: #2a2a30; --card-bg: #1b1b1f; --pill-bg: #262a4d; --pill-text: #b7c0ff;
    --code-bg: #24242a; --delta-up: #3ecf7e; --delta-down: #ff6b6b; --delta-flat: #9a9aa2;
    --chart-line: #8b87f7; --chart-demo: #ff9757; --grid-line: #28282e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 8px 8px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .kpi-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px; background: var(--card-bg); }
  .kpi-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 600; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .kpi-delta { font-size: 13px; font-weight: 500; }
  .delta-up { color: var(--delta-up); } .delta-down { color: var(--delta-down); } .delta-flat { color: var(--delta-flat); }
  section { margin-bottom: 30px; }
  h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .chart-wrap { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--bg); }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .table-wrap { overflow-x: auto; }
  .source-note { color: var(--text-faint); font-size: 11px; margin-top: 10px; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--pill-bg); color: var(--pill-text); }
  code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  footer { color: var(--text-faint); font-size: 11px; margin-top: 40px; border-top: 1px solid var(--border); padding-top: 16px; }
  @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } .two-col { grid-template-columns: 1fr; } }
</style>
</head>

function fmtDate(iso) { const d = new Date(iso + "T00:00:00Z"); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); }
function fmtYearMonth(ym) { const y = Number(ym.slice(0,4)), m = Number(ym.slice(4,6)); return new Date(y, m-1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }); }
function pct(a,b) { return b ? ((a-b)/b)*100 : null; }
function deltaHtml(current, prior, invert) {
  const p = pct(current, prior);
  if (p === null || !isFinite(p)) return '<span class="kpi-delta delta-flat">no prior data</span>';
  const good = invert ? p <= 0 : p >= 0;
  const cls = Math.abs(p) < 0.5 ? 'delta-flat' : (good ? 'delta-up' : 'delta-down');
  const sign = p > 0 ? '+' : '';
  return `<span class="kpi-delta ${cls}">${sign}${p.toFixed(1)}% vs prior week</span>`;
}

function lineChartSVG(labels, values, opts) {
  opts = opts || {};
  const W = 680, H = 190, padL = 34, padR = 8, padT = 10, padB = 20;
  const innerW = W - padL - padR, innerH = H - padT - padB, n = values.length;
  const maxV = (Math.max.apply(null, values) * 1.15) || 1;
  const x = i => padL + (n === 1 ? 0 : i * (innerW / (n - 1)));
  const y = v => padT + innerH - (v / maxV) * innerH;
  const pts = values.map((v, i) => [x(i), y(v)]);
  const linePath = "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
  const baseline = padT + innerH;
  const areaPath = linePath + ` L${x(n-1).toFixed(1)},${baseline} L${x(0).toFixed(1)},${baseline} Z`;
  const gridLines = [0,0.5,1].map(f => { const yy = y(maxV*f); return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>`; }).join('');
  const maxLabels = opts.maxLabels || 7, step = Math.max(1, Math.ceil(n / maxLabels));
  let labelEls = '';
  for (let i = 0; i < n; i += step) labelEls += `<text x="${x(i).toFixed(1)}" y="${H-4}" font-size="10" fill="var(--text-faint)" text-anchor="middle">${labels[i]}</text>`;
  const lastX = x(n-1), lastY = y(values[n-1]);
  return `<svg viewBox="0 0 ${W} ${H}">${gridLines}<path d="${areaPath}" fill="var(--chart-line)" opacity="0.12" stroke="none"/><path d="${linePath}" fill="none" stroke="var(--chart-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="var(--chart-line)"/><circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="6.5" fill="none" stroke="var(--chart-line)" stroke-width="1.3" opacity="0.5"/>${labelEls}</svg>`;
}

function barChartSVG(labels, values, opts) {
  opts = opts || {};
  const W = 680, H = 190, padL = 34, padR = 8, padT = 12, padB = 20;
  const innerW = W - padL - padR, innerH = H - padT - padB, n = values.length;
  const maxV = (Math.max.apply(null, values) * 1.15) || 1;
  const gap = opts.gap != null ? opts.gap : (n > 30 ? 1.5 : 6);
  const barW = (innerW - (n-1)*gap) / n, baseline = padT + innerH;
  const y = v => baseline - (v / maxV) * innerH;
  const color = opts.color || 'var(--chart-line)';
  let bars = '', labelEls = '';
  const maxLabels = opts.maxLabels || 12, step = Math.max(1, Math.ceil(n / maxLabels));
  for (let i = 0; i < n; i++) {
    const bx = padL + i*(barW+gap), by = y(values[i]), bh = baseline - by;
    bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}"><title>${labels[i]}: ${values[i].toLocaleString()}</title></rect>`;
    if (i % step === 0) labelEls += `<text x="${(bx+barW/2).toFixed(1)}" y="${H-4}" font-size="10" fill="var(--text-faint)" text-anchor="middle">${labels[i]}</text>`;
  }
  const gridLines = [0,0.5,1].map(f => { const yy = y(maxV*f); return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}">${gridLines}${bars}${labelEls}</svg>`;
}

document.getElementById('subtitle').innerHTML = `Capsule.video &middot; ${WEEK_LABEL} vs prior week &middot; <span class="pill">GA4 via Google Analytics MCP</span>`;

  </section>

  </div>
  <section>

    <div class="kpi-row" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 14px;">

      <div class="kpi-card"><div class="kpi-label">Users this week</div><div class="kpi-value">${DEMO_PAGE_CUR.users.toLocaleString()}</div>${deltaHtml(DEMO_PAGE_CUR.users,DEMO_PAGE_PRIOR.users)}</div>
      <div class="kpi-card"><div class="kpi-label">Pageviews this week</div><div class="kpi-value">${DEMO_PAGE_CUR.views.toLocaleString()}</div>${deltaHtml(DEMO_PAGE_CUR.views,DEMO_PAGE_PRIOR.views)}</div>
    </div>
    <div class="chart-wrap">${barChartSVG(DEMO_PAGE_TREND.map(r=>fmtDate(r[0])), DEMO_PAGE_TREND.map(r=>r[1]), {color:'var(--chart-demo)', maxLabels:8})}</div>
    <div class="source-note">Front door to the demo-booking flow, launched around Jul 29, 2026. Includes a stray <code>/demo-request.html</code> variant seen in GA4 alongside <code>/demo-request</code>.</div>
  </section>
`;

document.getElementById('footer').textContent = "Data snapshot generated " + new Date(GENERATED_AT).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) + " UTC. Rebuilt from Google Analytics MCP — republish to refresh.";
